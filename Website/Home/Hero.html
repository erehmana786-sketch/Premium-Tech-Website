<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Tech - Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Hero.css">
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <span class="hero-badge">Sourced from Hall Road & Azam Market, Lahore</span>

      <h1 class="hero-heading">
        Tech that feels<br>
        <span class="accent">premium.</span>
      </h1>

      <p class="hero-sub">Hand-checked accessories, delivered from Lahore to your doorstep.</p>

      <div class="hero-actions">
        <a href="Shop.html" class="btn-primary">Shop the Collection</a>
        <a href="#" class="btn-text">How sourcing works <span>›</span></a>
      </div>
    </div>

    <div class="hero-showcase">
      <div class="showcase-row">
        <div class="showcase-item item-large">
          <img src="products/phone-case.png" alt="Diamante Floral Phone Case">
        </div>
        <div class="showcase-item item-small">
          <img src="products/earbuds.png" alt="Pink Heart Earbuds">
        </div>
        <div class="showcase-item item-small">
          <img src="products/mouse.png" alt="Wireless Mouse">
        </div>
      </div>
    </div>
  </section>

</body>
</html>
