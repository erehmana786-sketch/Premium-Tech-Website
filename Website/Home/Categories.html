<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Tech - Categories</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Categories.css">
</head>
<body>

  <section class="categories">
    <h2 class="section-heading">Shop by Category</h2>
    <p class="section-sub">Everything you need, sourced and checked before it ships.</p>

    <div class="category-grid">
      <a href="#" class="category-card">
        <div class="category-img"><img src="products/mouse.png" alt="Mouse"></div>
        <span class="category-label">Mouse</span>
      </a>
      <a href="#" class="category-card">
        <div class="category-img"><img src="products/phone-case.png" alt="Mobile Covers"></div>
        <span class="category-label">Mobile Covers</span>
      </a>
      <a href="#" class="category-card">
        <div class="category-img"><img src="products/earbuds.png" alt="Earphones"></div>
        <span class="category-label">Earphones</span>
      </a>
      <a href="#" class="category-card">
        <div class="category-img"><img src="https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400" alt="Smartwatches"></div>
        <span class="category-label">Smartwatches</span>
      </a>
      <a href="#" class="category-card">
        <div class="category-img"><img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400" alt="Cables"></div>
        <span class="category-label">Cables</span>
      </a>
      <a href="#" class="category-card">
        <div class="category-img"><img src="https://images.unsplash.com/photo-1591290619762-361c6ec56e72?w=400" alt="Chargers"></div>
        <span class="category-label">Chargers</span>
      </a>
      <a href="#" class="category-card">
        <div class="category-img"><img src="https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=400" alt="Ring Lights"></div>
        <span class="category-label">Ring Lights</span>
      </a>
      <a href="#" class="category-card">
        <div class="category-img"><img src="https://images.unsplash.com/photo-1592890288564-76628a30a657?w=400" alt="Mobile Stands"></div>
        <span class="category-label">Mobile Stands</span>
      </a>
    </div>
  </section>

</body>
</html>
