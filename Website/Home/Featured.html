<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Tech - Featured Products</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Featured.css">
</head>
<body>

  <section class="featured">
    <h2 class="section-heading">Best Sellers</h2>
    <p class="section-sub">The pieces our customers keep coming back for.</p>

    <div class="product-grid">

      <div class="product-card">
        <span class="badge-tag">New</span>
        <div class="product-img"><img src="products/phone-case.png" alt="Diamante Floral Phone Case"></div>
        <h3 class="product-name">Diamante Floral Phone Case</h3>
        <div class="product-price">
          <span class="price-now">Rs. 1,299</span>
          <span class="price-old">Rs. 1,800</span>
        </div>
        <button class="add-btn">Add to Cart</button>
      </div>

      <div class="product-card">
        <span class="badge-tag">Best Seller</span>
        <div class="product-img"><img src="products/earbuds.png" alt="Pink Heart Earbuds"></div>
        <h3 class="product-name">Heart Edition Wireless Earbuds</h3>
        <div class="product-price">
          <span class="price-now">Rs. 2,499</span>
        </div>
        <button class="add-btn">Add to Cart</button>
      </div>

      <div class="product-card">
        <div class="product-img"><img src="products/mouse.png" alt="Cute Wireless Mouse"></div>
        <h3 class="product-name">E610 Wireless Mouse</h3>
        <div class="product-price">
          <span class="price-now">Rs. 999</span>
        </div>
        <button class="add-btn">Add to Cart</button>
      </div>

      <div class="product-card">
        <span class="badge-tag">Sale</span>
        <div class="product-img"><img src="https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400" alt="Smartwatch"></div>
        <h3 class="product-name">Aura Smartwatch</h3>
        <div class="product-price">
          <span class="price-now">Rs. 3,299</span>
          <span class="price-old">Rs. 4,000</span>
        </div>
        <button class="add-btn">Add to Cart</button>
      </div>

    </div>

    <a href="Shop.html" class="view-all">View All Products <span>›</span></a>
  </section>

</body>
</html>
